<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ventrixGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="vLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Polygon Frame -->
  <polygon points="50,5 88,25 88,75 50,95 12,75 12,25" fill="none" stroke="url(#ventrixGlow)" stroke-width="2.5" opacity="0.6"/>
  <!-- Top Light Accent -->
  <circle cx="50" cy="5" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <!-- Ventrix V Emblem -->
  <path d="M28 32 L44 32 L50 62 L56 32 L72 32 L55 72 L45 72 Z" fill="url(#vLight)" filter="url(#glow)"/>
  
  <!-- Subtle inner line -->
  <path d="M36 38 L50 64 L64 38" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
</svg>